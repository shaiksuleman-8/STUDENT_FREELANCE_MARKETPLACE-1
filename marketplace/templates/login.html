{% extends 'base.html' %}
{% load static %}

{% block title %}Sign In - Student Freelance Marketplace{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 40px auto;">
    <div class="card" style="padding: 36px;">
        <div style="text-align: center; margin-bottom: 28px;">
            <div class="brand-icon" style="margin: 0 auto 16px; width: 48px; height: 48px; font-size: 1.5rem;">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 style="font-size: 1.85rem; font-weight: 800; color: #fff;">Welcome Back</h1>
            <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 6px;">
                Log in to access your projects, proposals, and messages
            </p>
        </div>

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="username">
                    <i class="fa-solid fa-user"></i> Username or Email
                </label>
                <input type="text" name="username" id="username" class="form-input" placeholder="e.g. suleman.7 or user@student.edu" required autofocus>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label class="form-label" for="password" style="margin-bottom: 0;">
                        <i class="fa-solid fa-key"></i> Password
                    </label>
                </div>
                <input type="password" name="password" id="password" class="form-input" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 1rem; margin-top: 8px;">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account yet? 
            <a href="{% url 'register' %}" style="color: var(--primary); font-weight: 700;">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
